name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Tự động giải nén file zip code của pé
      - name: Unzip project files
        run: |
          if [ -f "Collections.zip" ]; then
            unzip -o Collections.zip -d .
          fi

      # Tìm thư mục chứa index.html và chuẩn bị folder www
      - name: Organize web assets into www folder
        run: |
          mkdir -p www
          INDEX_PATH=$(find . -maxdepth 3 -name "index.html" -not -path "./www/*" | head -n 1)
          
          if [ -n "$INDEX_PATH" ]; then
            SRC_DIR=$(dirname "$INDEX_PATH")
            echo "Found index.html in $SRC_DIR"
            cp -r "$SRC_DIR"/* www/ 2>/dev/null || true
          else
            echo "Could not find index.html!"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Ionic CLI & Capacitor
        run: |
          npm install -g @ionic/cli
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      # Khởi tạo và nâng target iOS lên 14.0 để tránh lỗi CocoaPods
      - name: Initialize Capacitor & Fix iOS Target
        run: |
          npx cap init "KawaiiApp" "com.kawaii.app" --web-dir www
          npx cap add ios
          
          # Sửa Podfile nâng platform ios lên 14.0
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '14.0'/g" ios/App/Podfile || true
          sed -i '' "s/platform :ios, '12.0'/platform :ios, '14.0'/g" ios/App/Podfile || true
          
          npx cap update ios
          npx cap copy

      - name: Build iOS App (.app)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release build CODE_SIGNING_ALLOWED=NO

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Release-iphoneos/App.app Payload/
          zip -r KawaiiApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KawaiiApp-IPA
          path: KawaiiApp.ipa
